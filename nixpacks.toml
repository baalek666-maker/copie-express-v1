# Force Railway à utiliser le dossier server/ pour le build
# Sans ce fichier, Railway détecte Next.js à la racine et build le frontend

[phases.setup]
nixPkgs = ["nodejs-22_x"]

[phases.install]
cmds = ["cd server && npm install"]

[phases.build]
cmds = ["echo 'No build step needed for Express'"]

[start]
cmd = "cd server && node index.js"
